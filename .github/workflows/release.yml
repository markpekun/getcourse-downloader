name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --locked --no-default-groups --group build --python 3.13

      - name: Install Playwright Firefox
        run: uv run --no-sync playwright install firefox

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          curl.exe -L --fail -o "$env:RUNNER_TEMP\ffmpeg.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg" -Force
          $Ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $Ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $Ffmpeg -or -not $Ffprobe) { throw "ffmpeg.exe or ffprobe.exe not found" }
          Copy-Item $Ffmpeg.FullName "resources\ffmpeg.exe" -Force
          Copy-Item $Ffprobe.FullName "resources\ffprobe.exe" -Force

      - name: Copy Playwright browser
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "resources\ms-playwright" | Out-Null
          Get-ChildItem "$env:LOCALAPPDATA\ms-playwright" -Directory -Filter "firefox-*" | ForEach-Object {
            Copy-Item $_.FullName "resources\ms-playwright" -Recurse -Force
          }

      - name: Build application
        shell: pwsh
        run: |
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          $Parts = (($Version -split '\.') + @("0", "0", "0", "0"))[0..3]
          uv run --no-sync flet pack main.py -y -D -n GetCourseVideoDownloader `
            --product-name "GetCourse Video Downloader" `
            --file-description "Загрузка видео с GetCourse" `
            --company-name "Mark Pekun" `
            --product-version $Version `
            --file-version ($Parts -join ".")
          if ($LASTEXITCODE -ne 0) { throw "flet pack failed" }
          Copy-Item resources "dist\GetCourseVideoDownloader" -Recurse -Force

      - name: Smoke-test packaged worker
        shell: pwsh
        run: |
          $Process = Start-Process `
            -FilePath "dist\GetCourseVideoDownloader\GetCourseVideoDownloader.exe" `
            -ArgumentList "--download-worker", "--help" `
            -Wait -PassThru -WindowStyle Hidden
          if ($Process.ExitCode -ne 0) { throw "Packaged worker smoke-test failed ($($Process.ExitCode))" }

      - name: Upload executable for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/GetCourseVideoDownloader/GetCourseVideoDownloader.exe
          archive: false
          retention-days: 1

      - name: Sign executable
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
          skip-decompress: true

      - name: Finalize release assets
        shell: pwsh
        run: |
          $SignedExe = "signed-exe\GetCourseVideoDownloader.exe"
          if (Test-Path $SignedExe) {
            Copy-Item $SignedExe "dist\GetCourseVideoDownloader\GetCourseVideoDownloader.exe" -Force
          }
          Compress-Archive -Path "dist\GetCourseVideoDownloader" -DestinationPath "dist\GetCourseVideoDownloader-win-x64.zip" -CompressionLevel Optimal -Force
          $Hash = (Get-FileHash "dist\GetCourseVideoDownloader-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "dist\GetCourseVideoDownloader-win-x64.zip.sha256" "$Hash  GetCourseVideoDownloader-win-x64.zip" -Encoding ascii
          uv export --preview-features sbom-export --locked --no-default-groups --format cyclonedx1.5 --output-file dist/sbom.cdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GetCourseVideoDownloader-win-x64
          path: |
            dist/GetCourseVideoDownloader-win-x64.zip
            dist/GetCourseVideoDownloader-win-x64.zip.sha256
            dist/sbom.cdx.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/GetCourseVideoDownloader-win-x64.zip
            dist/GetCourseVideoDownloader-win-x64.zip.sha256
            dist/sbom.cdx.json
