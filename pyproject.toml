[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "getcourse-downloader"
version = "4.0"
description = "Desktop application for downloading authorized GetCourse video lessons"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Pekun" }]
keywords = ["getcourse", "flet", "hls", "video", "downloader"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "aiohttp>=3.14,<4",
  "flet>=0.85,<0.86",
  "flet-desktop>=0.85,<0.86; platform_system == 'Windows'",
  "platformdirs>=4.3,<5",
  "playwright>=1.61,<2",
]

[project.urls]
Homepage = "https://github.com/markpekun/getcourse-downloader"
Issues = "https://github.com/markpekun/getcourse-downloader/issues"
Releases = "https://github.com/markpekun/getcourse-downloader/releases"

[project.gui-scripts]
getcourse-downloader = "getcourse_downloader.presentation.flet.app:run"

[project.scripts]
getcourse-discover = "getcourse_downloader.presentation.cli.discover:main"
getcourse-live-browser = "getcourse_downloader.presentation.cli.live_browser:main"

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "pre-commit>=4.6,<5",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<0.17",
]
build = [
  "flet-cli>=0.85,<0.86",
  "pyinstaller>=6.21,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["build", "dist", ".venv", "resources"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "C4", "PIE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["getcourse_downloader"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/", "resources/"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = [
  "getcourse_downloader.presentation.flet.screens.courses.view",
  "getcourse_downloader.presentation.flet.screens.start.view",
]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --basetemp=.cache/pytest-tmp"
cache_dir = ".cache/pytest-cache"
markers = [
  "integration: tests using local process or network adapters",
  "live: opt-in tests requiring a real GetCourse account",
]

[tool.coverage.run]
branch = true
source = ["getcourse_downloader"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
